<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dev — Cerebro do Conhecimento</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0B0F19;
    --bg-2: #0e1424;
    --ink: #cdd6f4;
    --ink-dim: #6b7593;
    --ink-faint: #3a4361;
    --accent: #4cc3ff;
    --accent-2: #79e8ff;
    --hot: #ffffff;
    --panel: rgba(14, 20, 36, 0.72);
    --panel-border: rgba(140, 170, 220, 0.10);
    --shadow: 0 12px 40px -12px rgba(0,0,0,0.7);
  }
  * { box-sizing: border-box; }
  html, body, #root {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px;
    line-height: 1.4;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  body {
    background:
      radial-gradient(ellipse at center, #0e1526 0%, #0B0F19 60%, #06080f 100%);
  }
  canvas#graph {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: grab;
    touch-action: none;
  }
  canvas#graph.grabbing { cursor: grabbing; }
  canvas#graph.pointing { cursor: pointer; }

  /* ── Top-left brand ─────────────────────────────────── */
  .brand {
    position: fixed; top: 22px; left: 24px;
    display: flex; align-items: center; gap: 10px;
    pointer-events: none;
    user-select: none;
    z-index: 10;
  }
  .brand-dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent), 0 0 24px rgba(76,195,255,.4);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: .55; transform: scale(.85); }
    50%     { opacity: 1;   transform: scale(1.1); }
  }
  .brand-name {
    font-weight: 600; letter-spacing: 0.18em;
    text-transform: uppercase;
    font-size: 11px;
    color: var(--ink);
  }
  .brand-sub {
    font-size: 11px;
    color: var(--ink-dim);
    letter-spacing: 0.04em;
  }

  /* ── Tooltip ─────────────────────────────────────────── */
  .tooltip {
    position: fixed;
    pointer-events: none;
    z-index: 20;
    background: rgba(11, 15, 25, 0.92);
    border: 1px solid rgba(76, 195, 255, 0.25);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    padding: 8px 11px;
    border-radius: 7px;
    font-size: 11.5px;
    box-shadow: 0 8px 28px -8px rgba(0,0,0,.7), 0 0 24px -8px rgba(76,195,255,.3);
    transform: translate(12px, 12px);
    min-width: 160px;
  }
  .tooltip-label {
    color: var(--ink);
    font-weight: 500;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    letter-spacing: 0.02em;
  }
  .tooltip-desc {
    margin-top: 3px;
    color: var(--ink-dim);
    font-size: 10.5px;
    font-style: italic;
  }
  .tooltip-meta {
    margin-top: 4px;
    color: var(--ink-dim);
    font-size: 10.5px;
    display: flex;
    gap: 8px;
  }
  .tooltip-meta span { display: inline-flex; align-items: center; gap: 4px; }
  .tooltip-meta i {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--accent);
    display: inline-block;
  }
  .tooltip-badge {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* ── Control panel ──────────────────────────────────── */
  .panel {
    position: fixed; bottom: 22px; right: 22px;
    width: 248px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 14px 14px 12px;
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    box-shadow: var(--shadow);
    z-index: 15;
    user-select: none;
  }
  .panel-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
  }
  .panel-title {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--ink-dim);
    font-weight: 600;
  }
  .panel-collapse {
    background: none; border: 0; color: var(--ink-dim);
    cursor: pointer; padding: 4px;
    transition: color .15s;
  }
  .panel-collapse:hover { color: var(--ink); }

  .ctl {
    display: flex; flex-direction: column;
    gap: 5px;
    margin-bottom: 11px;
  }
  .ctl-head {
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .ctl-label {
    font-size: 11.5px;
    color: var(--ink);
    font-weight: 500;
  }
  .ctl-value {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10.5px;
    color: var(--accent);
  }
  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 16px;
    background: transparent;
    margin: 0;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 2px;
    background: linear-gradient(to right, var(--accent) 0%, var(--accent) var(--p,50%), rgba(140,170,220,.12) var(--p,50%), rgba(140,170,220,.12) 100%);
    border-radius: 2px;
  }
  input[type="range"]::-moz-range-track {
    height: 2px;
    background: rgba(140,170,220,.12);
    border-radius: 2px;
  }
  input[type="range"]::-moz-range-progress {
    height: 2px; background: var(--accent); border-radius: 2px;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 12px; height: 12px; border-radius: 50%;
    background: #eaf6ff;
    border: 2px solid var(--accent);
    margin-top: -5px;
    box-shadow: 0 0 8px rgba(76,195,255,.5);
    cursor: pointer;
    transition: transform .12s;
  }
  input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); }
  input[type="range"]::-moz-range-thumb {
    width: 10px; height: 10px; border-radius: 50%;
    background: #eaf6ff; border: 2px solid var(--accent);
    box-shadow: 0 0 8px rgba(76,195,255,.5);
    cursor: pointer;
  }

  .divider {
    height: 1px;
    background: linear-gradient(to right, transparent, var(--panel-border), transparent);
    margin: 8px 0 12px;
  }

  .view-presets {
    display: flex; flex-direction: column;
    margin-bottom: 11px;
  }
  .view-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
  }
  .view-btn {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px;
    padding: 6px 4px 5px;
    background: rgba(140,170,220,.05);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    color: var(--ink-dim);
    cursor: pointer;
    transition: all .14s ease;
    font-family: 'Inter', sans-serif;
    font-size: 9.5px;
    letter-spacing: 0.04em;
  }
  .view-btn:hover {
    color: var(--accent-2);
    border-color: rgba(76,195,255,.32);
    background: rgba(76,195,255,.08);
  }
  .view-btn:active { transform: scale(.96); }
  .view-btn svg { display: block; opacity: .9; }

  .trigger {
    width: 100%;
    border: 1px solid rgba(76,195,255,.35);
    background: linear-gradient(180deg, rgba(76,195,255,.12), rgba(76,195,255,.04));
    color: var(--accent-2);
    padding: 9px 12px;
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: all .15s ease;
    position: relative; overflow: hidden;
  }
  .trigger:hover {
    border-color: var(--accent);
    color: var(--hot);
    background: linear-gradient(180deg, rgba(76,195,255,.22), rgba(76,195,255,.08));
    box-shadow: 0 0 24px -4px rgba(76,195,255,.45);
  }
  .trigger:active { transform: scale(.985); }
  .trigger .spark {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent-2);
    box-shadow: 0 0 10px var(--accent-2);
  }
  .toggle-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 10px;
    font-size: 11px; color: var(--ink-dim);
  }
  .toggle {
    width: 28px; height: 16px; border-radius: 999px;
    background: rgba(140,170,220,.18);
    position: relative; cursor: pointer;
    transition: background .15s;
  }
  .toggle.on { background: rgba(76,195,255,.45); }
  .toggle::after {
    content: ''; position: absolute;
    top: 2px; left: 2px;
    width: 12px; height: 12px; border-radius: 50%;
    background: #cdd6f4;
    transition: transform .18s ease, background .15s;
  }
  .toggle.on::after { transform: translateX(12px); background: #fff; box-shadow: 0 0 8px rgba(76,195,255,.6); }

  .panel.collapsed .panel-body { display: none; }
  .panel.collapsed { width: auto; padding: 8px 12px; }

  /* ── Legend ─────────────────────────────────────────── */
  .legend {
    display: flex; flex-direction: column; gap: 5px;
    margin-bottom: 11px;
  }
  .legend-item {
    display: flex; align-items: center; gap: 8px;
    font-size: 10.5px; color: var(--ink-dim);
  }
  .legend-dot {
    width: 7px; height: 7px; border-radius: 50%;
    flex-shrink: 0;
  }

  /* ── Bottom-left status ─────────────────────────────── */
  .status {
    position: fixed; bottom: 22px; left: 24px;
    display: flex; gap: 18px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10.5px;
    color: var(--ink-dim);
    pointer-events: none;
    user-select: none;
    z-index: 10;
  }
  .status .stat {
    display: flex; align-items: center; gap: 6px;
  }
  .status .stat b {
    color: var(--ink);
    font-weight: 500;
  }

  .hint {
    position: fixed; top: 22px; right: 24px;
    font-size: 10.5px;
    color: var(--ink-faint);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    pointer-events: none;
    user-select: none;
  }

  .kbd {
    display: inline-block;
    padding: 1px 5px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    border: 1px solid var(--ink-faint);
    border-radius: 3px;
    color: var(--ink-dim);
    margin: 0 2px;
  }

  /* ── MD Viewer modal ─────────────────────────────────────── */
  .md-overlay {
    position: fixed; inset: 0;
    background: rgba(4, 6, 14, 0.72);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 29;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .md-overlay.open { opacity: 1; pointer-events: auto; }
  .md-viewer {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.96);
    width: min(860px, 90vw);
    height: min(720px, 86vh);
    background: rgba(10, 14, 24, 0.98);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    display: flex; flex-direction: column;
    z-index: 30;
    opacity: 0; pointer-events: none;
    transition: transform 0.22s cubic-bezier(.4,0,.2,1), opacity 0.22s ease;
    box-shadow: 0 32px 80px rgba(0,0,0,0.8), 0 0 0 1px rgba(76,195,255,0.06);
  }
  .md-viewer.open {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1; pointer-events: auto;
  }
  .md-viewer-header {
    display: flex; align-items: center; gap: 8px;
    padding: 14px 16px 12px;
    border-bottom: 1px solid var(--panel-border);
    flex-shrink: 0;
  }
  .md-viewer-title {
    flex: 1; min-width: 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; font-weight: 500;
    color: var(--accent);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    letter-spacing: 0.02em;
  }
  .md-viewer-close {
    background: none; border: none; cursor: pointer;
    color: var(--ink-dim); padding: 4px;
    border-radius: 4px; line-height: 1;
    transition: color .15s;
  }
  .md-viewer-close:hover { color: var(--ink); }
  .md-viewer-body {
    flex: 1; overflow-y: auto; padding: 20px 20px 32px;
    scrollbar-width: thin;
    scrollbar-color: var(--ink-faint) transparent;
  }
  .md-viewer-body::-webkit-scrollbar { width: 4px; }
  .md-viewer-body::-webkit-scrollbar-track { background: transparent; }
  .md-viewer-body::-webkit-scrollbar-thumb { background: var(--ink-faint); border-radius: 2px; }
  /* Markdown typography */
  .md-content { font-size: 12.5px; line-height: 1.7; color: var(--ink); }
  .md-content h1 { font-size: 17px; font-weight: 600; color: var(--accent); margin: 0 0 12px; border-bottom: 1px solid var(--panel-border); padding-bottom: 8px; }
  .md-content h2 { font-size: 14px; font-weight: 600; color: #a8d8ef; margin: 20px 0 8px; }
  .md-content h3 { font-size: 13px; font-weight: 500; color: #7bbbd4; margin: 14px 0 6px; }
  .md-content p  { margin: 0 0 10px; }
  .md-content ul, .md-content ol { padding-left: 18px; margin: 0 0 10px; }
  .md-content li { margin-bottom: 4px; }
  .md-content code { font-family: 'JetBrains Mono', monospace; font-size: 11px; background: rgba(76,195,255,0.08); color: #79e8ff; padding: 1px 5px; border-radius: 3px; }
  .md-content pre  { background: rgba(0,0,0,0.35); border: 1px solid var(--panel-border); border-radius: 6px; padding: 12px; overflow-x: auto; margin: 0 0 12px; }
  .md-content pre code { background: none; padding: 0; color: #cdd6f4; }
  .md-content blockquote { border-left: 2px solid var(--accent); margin: 0 0 10px; padding: 4px 12px; color: var(--ink-dim); }
  .md-content a { color: var(--accent); text-decoration: none; }
  .md-content a:hover { text-decoration: underline; }
  .md-content hr { border: none; border-top: 1px solid var(--panel-border); margin: 16px 0; }
  .md-content table { width: 100%; border-collapse: collapse; font-size: 11.5px; margin: 0 0 12px; }
  .md-content th, .md-content td { padding: 5px 8px; border: 1px solid var(--panel-border); text-align: left; }
  .md-content th { background: rgba(76,195,255,0.07); color: var(--accent); }
  /* Satellite info panel */
  .md-sat-panel { padding: 16px 0; }
  .md-sat-concept { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 600; margin-bottom: 6px; }
  .md-sat-parent { font-size: 11px; color: var(--ink-dim); margin-bottom: 20px; }
  .md-sat-hint { font-size: 11px; color: var(--ink-faint); }
</style>
</head>
<body>
  <canvas id="graph"></canvas>

  <div class="brand">
    <span class="brand-dot"></span>
    <span class="brand-name">Dev</span>
    <span class="brand-sub">— thought graph</span>
  </div>

  <div class="hint">
    drag · rotate &nbsp;·&nbsp; shift+drag · pan &nbsp;·&nbsp; scroll · zoom &nbsp;·&nbsp; <span class="kbd">space</span> pulsar
  </div>

  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/d3@7.8.5/dist/d3.min.js"></script>

  <script type="text/babel" data-presets="react">
/**
 * Dev Cerebro — vault knowledge graph visualizado como cérebro 3D.
 *
 * Regiões cerebrais mapeadas para contextos do vault:
 *   cerebrum-L  → DSG (v1 + v2 + microserviços)
 *   cerebrum-R  → CAST (SGSA, Contratos, SisDoc)
 *   cerebellum  → Tools (Skills, Agentes)
 *   brainstem   → MCPs (integrações externas)
 *
 * Nós nomeados = conhecimento real do vault. Nós de fundo = neurônios neutros.
 */

// ──────────────────────────────────────────────────────────────────────────
// Paleta por categoria
// ──────────────────────────────────────────────────────────────────────────
const CAT_COLOR = {
  dsg:     '#4cc3ff',  // azul — DSG
  cast:    '#7dd4a4',  // verde — CAST
  skill:   '#c084fc',  // roxo — Skills
  agent:   '#fbbf24',  // âmbar — Agentes
  mcp:     '#fb923c',  // laranja — MCPs
  session: '#e2e8f0',  // prata — Sessões/engrams
  bg:      '#4cc3ff',  // neurônios de fundo
};

// ──────────────────────────────────────────────────────────────────────────
// Nós nomeados do vault — colocados nas regiões corretas do cérebro
// ──────────────────────────────────────────────────────────────────────────
const VAULT_NODES = [
  // ── Cerebelo: Tools / Agentes ──────────────────────────────────────────
  { name: 'Claudicaro',      region: 'cerebellum', hub: true,  category: 'agent', weight: 1.00, desc: 'Persona ativa — orquestra tudo (bypass/plano/accepts)',      md: 'tools/agents/🧠 Claudicaro.md' },
  { name: '/commit',         region: 'cerebellum', hub: true,  category: 'skill', weight: 0.88, desc: 'branch → review → commit → push → PR',                      md: 'tools/skills/🛠️ Skills.md' },
  { name: '/plan-executor',  region: 'cerebellum', hub: true,  category: 'skill', weight: 0.85, desc: 'Waves paralelas com task-workers',                           md: 'tools/skills/🛠️ Skills.md' },
  { name: '/commit-qa',      region: 'cerebellum', hub: false, category: 'skill', weight: 0.65, desc: 'commit + push + mensagem QA (sem branch nem PR)',            md: 'tools/skills/🛠️ Skills.md' },
  { name: '/review-diff',    region: 'cerebellum', hub: false, category: 'skill', weight: 0.60, desc: 'Code review do diff atual ou da branch inteira',             md: 'tools/skills/🛠️ Skills.md' },
  { name: '/plan-analyzer',  region: 'cerebellum', hub: false, category: 'skill', weight: 0.58, desc: 'Dry-run: analisa waves com dependências',                    md: 'tools/skills/🛠️ Skills.md' },
  { name: '/compact-v2',     region: 'cerebellum', hub: false, category: 'skill', weight: 0.55, desc: 'Salva memória estruturada antes de compactar',               md: 'tools/skills/🛠️ Skills.md' },
  { name: '/pr-review',      region: 'cerebellum', hub: false, category: 'skill', weight: 0.55, desc: 'Revisa PR Bitbucket: diff, comentários, aprovações',         md: 'tools/skills/🛠️ Skills.md' },
  { name: 'Task Worker',     region: 'cerebellum', hub: false, category: 'agent', weight: 0.62, desc: 'Agente isolado de implementação — nunca commita',            md: 'tools/agents/⚙️ Task Worker.md' },

  // ── Hemisfério E: DSG ──────────────────────────────────────────────────
  { name: 'Tech Lead DSG',        region: 'cerebrum-L', hub: true,  category: 'dsg', weight: 0.92, desc: 'Orquestra v1 + v2 + microserviços DSG',                        md: 'dsg/cerebro-tech-lead/🧠 Tech Lead.md' },
  { name: 'Tech Lead MS',         region: 'cerebrum-L', hub: true,  category: 'dsg', weight: 0.82, desc: 'ms-auth, ms-ged, microservice-email, microservice-ia',          md: 'dsg/cerebro-tech-lead/🧠 Tech Lead.md' },
  { name: 'Depósito Antecipado',  region: 'cerebrum-L', hub: false, category: 'dsg', weight: 0.70, desc: 'Agendamento + pagamento antecipado (8 bugs mapeados)',           md: 'dsg/cerebros-especialistas/deposito-antecipado/💰 Deposito Antecipado.md' },
  { name: 'Reserva de Horário',   region: 'cerebrum-L', hub: false, category: 'dsg', weight: 0.68, desc: 'Slots SOC + interna — bug #332 documentado',                    md: 'dsg/cerebros-especialistas/reserva-horario/📅 Reserva de Horário.md' },
  { name: 'Banco de Dados',       region: 'cerebrum-L', hub: false, category: 'dsg', weight: 0.65, desc: 'PostgreSQL + MongoDB + Redis',                                  md: 'dsg/cerebros-especialistas/banco-de-dados/🗄️ Banco de Dados.md' },
  { name: 'Filas SQS',            region: 'cerebrum-L', hub: false, category: 'dsg', weight: 0.58, desc: 'AWS SQS — filas assíncronas',                                   md: 'dsg/cerebros-especialistas/filas-sqs/📨 Filas SQS.md' },

// ──────────────────────────────────────────────────────────────────────────
// Anatomia do cérebro (igual ao original)
// ──────────────────────────────────────────────────────────────────────────
const HEMI = {
  cxOffset: 100,
  outW: 152,
  inW:  118,
  frontH: 178,
  backH:  234,
  topV:   128,
  bottomV: 118,
};
const CEREB = { cxOffset: 46, cy: 268, cz: -32, a: 58, b: 44, c: 50 };

function brainRegion(x, y, z) {
  const hemi = (side) => {
    const dx = x - side * HEMI.cxOffset;
    const dy = y;
    const dz = z;
    const a = (dx * side >= 0) ? HEMI.outW : HEMI.inW;
    const b = (dy < 0)         ? HEMI.frontH : HEMI.backH;
    const c = (dz > 0)         ? HEMI.topV  : HEMI.bottomV;
    const r2 = (dx*dx)/(a*a) + (dy*dy)/(b*b) + (dz*dz)/(c*c);
    const theta = Math.atan2(dy, dx);
    const phi   = Math.atan2(dz, Math.sqrt(dx*dx + dy*dy));
    const wobble = 1
      + 0.050 * Math.sin(9  * theta + side * 0.4)
      + 0.025 * Math.sin(15 * phi   + side * 1.1);
    if (r2 < wobble * wobble) {
      const fissureW = 10
        - Math.max(0, (dy - 50) * 0.022)
        - Math.max(0, (-dy - 50) * 0.018);
      if (Math.abs(x) < Math.max(5, fissureW)) return null;
      return side < 0 ? 'cerebrum-L' : 'cerebrum-R';
    }
    return null;
  };
  const l = hemi(-1); if (l) return l;
  const r = hemi( 1); if (r) return r;

  for (const side of [-1, 1]) {
    const dx = x - side * CEREB.cxOffset;
    const dy = y - CEREB.cy;
    const dz = z - CEREB.cz;
    const r2 = (dx*dx)/(CEREB.a*CEREB.a)
             + (dy*dy)/(CEREB.b*CEREB.b)
             + (dz*dz)/(CEREB.c*CEREB.c);
    const theta = Math.atan2(dy, dx);
    const wobble = 1 + 0.085 * Math.sin(13 * theta + side * 0.6);
    if (r2 < wobble * wobble) return 'cerebellum';
  }

  {
    const dx = x;
    const dy = y - 268;
    if (dx*dx/(13*13) + dy*dy/(42*42) < 1 && z > -120 && z < 10) {
      return 'brainstem';
    }
  }
  return null;
}

// ──────────────────────────────────────────────────────────────────────────
// buildBrainGraph — only vault nodes, no background fill
// ──────────────────────────────────────────────────────────────────────────
function buildBrainGraph() {
  const nodes = [];
  const nameToId = {};

  // 1. Place each vault node by rejection-sampling in its target region
  for (const vn of VAULT_NODES) {
    let placed = false;
    for (let attempt = 0; attempt < 2000; attempt++) {
      const x = (Math.random() - 0.5) * 560;
      const y = (Math.random() - 0.5) * 540 + 50;
      const z = (Math.random() - 0.5) * 300;
      if (brainRegion(x, y, z) !== vn.region) continue;

      // Cortical bias for hemispheres — vault nodes prefer the mid-zone, not just rim
      if (vn.region.startsWith('cerebrum')) {
        const side = vn.region === 'cerebrum-L' ? -1 : 1;
        const dx = x - side * HEMI.cxOffset, dy = y, dz = z;
        const a = (dx * side >= 0) ? HEMI.outW : HEMI.inW;
        const b = (dy < 0) ? HEMI.frontH : HEMI.backH;
        const c = (dz > 0) ? HEMI.topV  : HEMI.bottomV;
        const r = Math.min(1, Math.sqrt((dx*dx)/(a*a) + (dy*dy)/(b*b) + (dz*dz)/(c*c)));
        // Hub nodes closer to centre; leaf nodes on the rim
        const rimBias = vn.hub ? 0.5 : 0.7;
        const accept = rimBias + (1 - rimBias) * r * r;
        if (Math.random() > accept) continue;
      }

      const id = nodes.length;
      nameToId[vn.name] = id;
      nodes.push({
        id, x, y, z,
        region: vn.region,
        weight: vn.weight,
        label: vn.name,
        category: vn.category,
        desc: vn.desc,
        hub: vn.hub,
        md: vn.md || null,
        isVault: true,
        phase: Math.random() * Math.PI * 2,
        freq: 0.4 + Math.random() * 0.5,
        amp:  0.8 + Math.random() * 1.4,
      });
      placed = true;
      break;
    }
    if (!placed) {
      // Fallback: place at region centroid
      let fx = 0, fy = 0, fz = 0;
      if (vn.region === 'cerebrum-L')  { fx = -HEMI.cxOffset; fy = 0; fz = 0; }
      if (vn.region === 'cerebrum-R')  { fx =  HEMI.cxOffset; fy = 0; fz = 0; }
      if (vn.region === 'cerebellum')  { fx = 0; fy = CEREB.cy; fz = CEREB.cz; }
      if (vn.region === 'brainstem')   { fx = 0; fy = 268; fz = -55; }
      const id = nodes.length;
      nameToId[vn.name] = id;
      nodes.push({
        id, x: fx + (Math.random()-0.5)*20, y: fy + (Math.random()-0.5)*20, z: fz + (Math.random()-0.5)*20,
        region: vn.region, weight: vn.weight, label: vn.name,
        category: vn.category, desc: vn.desc, hub: vn.hub, md: vn.md || null, isVault: true,
        phase: Math.random() * Math.PI * 2, freq: 0.4 + Math.random() * 0.5, amp: 0.8 + Math.random() * 1.4,
      });
    }
  }

  // 2. Place satellite nodes around each vault node
  for (const [parentName, concepts] of Object.entries(SATELLITE_MAP)) {
    const parentId = nameToId[parentName];
    if (parentId === undefined) continue;
    const parent = nodes[parentId];
    for (const concept of concepts) {
      let placed = false;
      for (let attempt = 0; attempt < 120; attempt++) {
        const angle = Math.random() * Math.PI * 2;
        const elev  = (Math.random() - 0.5) * Math.PI;
        const r     = 28 + Math.random() * 38;
        const x = parent.x + r * Math.cos(angle) * Math.cos(elev);
        const y = parent.y + r * Math.sin(elev);
        const z = parent.z + r * Math.sin(angle) * Math.cos(elev);
        if (brainRegion(x, y, z) !== parent.region) continue;
        const id = nodes.length;
        nodes.push({
          id, x, y, z, region: parent.region,
          weight: 0.06 + Math.random() * 0.10,
          label: concept,
          category: parent.category,
          desc: '', hub: false, isVault: false, isSatellite: true, parentId, parentName,
          phase: Math.random() * Math.PI * 2,
          freq:  0.35 + Math.random() * 0.45,
          amp:   0.5  + Math.random() * 0.7,
        });
        if (!parent.satelliteLabels) parent.satelliteLabels = [];
        parent.satelliteLabels.push(concept);
        placed = true;
        break;
      }
    }
  }

  // ── Edges ────────────────────────────────────────────────────────────
  const links = [];
  const seen = new Set();
  const addLink = (a, b) => {
    if (a === b) return;
    const k = a < b ? `${a}-${b}` : `${b}-${a}`;
    if (seen.has(k)) return;
    seen.add(k);
    const na = nodes[a], nb = nodes[b];
    const d = Math.hypot(na.x - nb.x, na.y - nb.y, na.z - nb.z);
    links.push({ source: a, target: b, rest: d, isVaultLink: false });
  };

  // kNN for vault nodes only (satellites connect only to their parent below)
  for (let i = 0; i < nodes.length; i++) {
    const a = nodes[i];
    if (a.isSatellite) continue;
    const neigh = [];
    for (let j = 0; j < nodes.length; j++) {
      if (i === j) continue;
      const b = nodes[j];
      if (b.isSatellite) continue;
      const d = Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z);
      if (a.region.startsWith('cerebrum') && b.region.startsWith('cerebrum')
          && a.region !== b.region && d > 80) continue;
      neigh.push({ j, d });
    }
    neigh.sort((p, q) => p.d - q.d);
    const k = 2 + (a.hub ? 2 : 0);
    for (let n = 0; n < Math.min(k, neigh.length); n++) {
      if (neigh[n].d < 220) addLink(i, neigh[n].j);
    }
  }

  // Inter-hemispheric hub bridges (vault nodes only)
  const leftHubs  = nodes.filter(n => n.region === 'cerebrum-L' && n.hub && !n.isSatellite);
  const rightHubs = nodes.filter(n => n.region === 'cerebrum-R' && n.hub && !n.isSatellite);
  for (const lh of leftHubs) {
    let best = null, bestD = Infinity;
    for (const rh of rightHubs) {
      const d = Math.hypot(lh.x - rh.x, lh.y - rh.y, lh.z - rh.z);
      if (d < bestD) { bestD = d; best = rh; }
    }
    if (best) addLink(lh.id, best.id);
  }

  // Cerebellum ↔ brainstem (vault nodes only)
  const stem  = nodes.filter(n => n.region === 'brainstem'  && !n.isSatellite);
  const cereb = nodes.filter(n => n.region === 'cerebellum' && !n.isSatellite);
  stem.forEach(s => {
    let nearest = null, nd = Infinity;
    cereb.forEach(c => {
      const d = Math.hypot(s.x - c.x, s.y - c.y, s.z - c.z);
      if (d < nd) { nd = d; nearest = c; }
    });
    if (nearest) addLink(s.id, nearest.id);
  });

  // Explicit vault links — added on top
  const vaultLinkSet = new Set();
  for (const [aName, bName] of VAULT_LINKS_NAMED) {
    const aId = nameToId[aName];
    const bId = nameToId[bName];
    if (aId === undefined || bId === undefined) continue;
    const k = aId < bId ? `${aId}-${bId}` : `${bId}-${aId}`;
    if (!seen.has(k)) {
      seen.add(k);
      const na = nodes[aId], nb = nodes[bId];
      const d = Math.hypot(na.x - nb.x, na.y - nb.y, na.z - nb.z);
      links.push({ source: aId, target: bId, rest: d, isVaultLink: true });
    } else {
      // Mark existing link as vault link
      for (const l of links) {
        const ls = typeof l.source === 'number' ? l.source : l.source.id;
        const lt = typeof l.target === 'number' ? l.target : l.target.id;
        if ((ls === aId && lt === bId) || (ls === bId && lt === aId)) {
          l.isVaultLink = true;
          break;
        }
      }
    }
    vaultLinkSet.add(k);
  }

  // Satellite → parent links (thin, faint)
  for (const n of nodes) {
    if (!n.isSatellite) continue;
    const a2 = n.id < n.parentId ? n.id : n.parentId;
    const b2 = n.id < n.parentId ? n.parentId : n.id;
    const k2 = `${a2}-${b2}`;
    if (seen.has(k2)) continue;
    seen.add(k2);
    const parent = nodes[n.parentId];
    const d = Math.hypot(n.x - parent.x, n.y - parent.y, n.z - parent.z);
    links.push({ source: n.id, target: n.parentId, rest: d, isVaultLink: false, isSatelliteLink: true });
  }

  const adjacency = nodes.map(() => []);
  for (const l of links) {
    const s = typeof l.source === 'number' ? l.source : l.source.id;
    const t = typeof l.target === 'number' ? l.target : l.target.id;
    adjacency[s].push(t);
    adjacency[t].push(s);
  }
  for (const l of links) {
    if (typeof l.source === 'number') l.source = nodes[l.source];
    if (typeof l.target === 'number') l.target = nodes[l.target];
  }

  return { nodes, links, adjacency, nameToId };
}

// ──────────────────────────────────────────────────────────────────────────
// Brain surface + dust (idêntico ao original)
// ──────────────────────────────────────────────────────────────────────────
function isInSulcus(x, y, z) {
  if (Math.abs(y + 22) * 0.9 + Math.abs(z - 35) * 0.5 < 20) return true;
  if (Math.abs(z + 58) + Math.abs(Math.abs(x) - 92) * 0.55 < 22) return true;
  if (Math.abs(y - 85) * 0.8 + Math.abs(z - 40) * 0.6 < 18) return true;
  if (Math.abs(y + 55) * 0.9 + Math.abs(z - 40) * 0.5 < 14) return true;
  if (Math.abs(y +  5) * 0.9 + Math.abs(z - 45) * 0.5 < 14) return true;
  if (Math.abs(x) < 6 && z > -80 && z < 110) return true;
  return false;
}

function isSurfaceShell(x, y, z) {
  const region = brainRegion(x, y, z);
  if (!region) return false;
  let cx = 0, cy = 0, cz = 0;
  if      (region === 'cerebrum-L')  cx = -HEMI.cxOffset;
  else if (region === 'cerebrum-R')  cx =  HEMI.cxOffset;
  else if (region === 'cerebellum') {
    const side = x < 0 ? -1 : 1;
    cx = side * CEREB.cxOffset; cy = CEREB.cy; cz = CEREB.cz;
  } else if (region === 'brainstem') { cy = 268; cz = -55; }
  const f = 1.11;
  return !brainRegion(cx + (x-cx)*f, cy + (y-cy)*f, cz + (z-cz)*f);
}

function buildBrainSurface(count) {
  const pts = [];
  let attempts = 0;
  const max = count * 55;
  while (pts.length < count && attempts < max) {
    attempts++;
    const x = (Math.random() - 0.5) * 560;
    const y = (Math.random() - 0.5) * 540 + 50;
    const z = (Math.random() - 0.5) * 300;
    if (!isSurfaceShell(x, y, z)) continue;
    if (isInSulcus(x, y, z)) continue;
    pts.push({ x, y, z });
  }
  return pts;
}

function makeSurfaceSprite(color, size) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const r = size / 2;
  const grad = ctx.createRadialGradient(r, r, 0, r, r, r);
  grad.addColorStop(0,    `${color}cc`);
  grad.addColorStop(0.35, `${color}66`);
  grad.addColorStop(0.7,  `${color}1a`);
  grad.addColorStop(1,    `${color}00`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);
  return c;
}

function buildBrainDust(count) {
  const dust = [];
  let attempts = 0;
  while (dust.length < count && attempts < count * 30) {
    attempts++;
    const x = (Math.random() - 0.5) * 560;
    const y = (Math.random() - 0.5) * 540 + 50;
    const z = (Math.random() - 0.5) * 300;
    if (brainRegion(x, y, z)) dust.push({ x, y, z });
  }
  return dust;
}

function makeGlowSprite(color, size = 128) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const r = size / 2;
  const grad = ctx.createRadialGradient(r, r, 0, r, r, r);
  grad.addColorStop(0,    `${color}ff`);
  grad.addColorStop(0.18, `${color}aa`);
  grad.addColorStop(0.45, `${color}33`);
  grad.addColorStop(1,    `${color}00`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);
  return c;
}

// ──────────────────────────────────────────────────────────────────────────
// CerebroEngine
// ──────────────────────────────────────────────────────────────────────────
class CerebroEngine {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d', { alpha: false });
    this.dpr = window.devicePixelRatio || 1;
    this.width = 0; this.height = 0;
    this.nodes = [];
    this.links = [];
    this.adjacency = [];
    this.dust = [];
    this.nameToId = {};
    this.camera = {
      yaw: 0.42, pitch: 0.55,
      targetYaw: 0.42, targetPitch: 0.55,
      animating: false,
      autoRotate: false,
    };
    this.transform = { k: 1, x: 0, y: 0 };
    this._proj = null;
    this.hoverId = null;
    this.thoughts = [];
    this.options = { speed: 1.0, glow: 1.0, nodeCount: 200 };
    this.running = true;
    this.rafId = 0;
    this.onHover = () => {};
    this.onStats = () => {};
    this.onCamera = () => {};
    this.onNodeClick = () => {};

    // Category glow sprites
    this.glowSprites = {};
    for (const [cat, col] of Object.entries(CAT_COLOR)) {
      this.glowSprites[cat] = makeGlowSprite(col);
    }
    this.glowHot  = makeGlowSprite('#ffffff');
    this.glowDust = makeGlowSprite('#3a78c0', 32);
    this.surfaceSprite = makeSurfaceSprite('#4cc3ff', 44);
    this.surface = [];
    this.dragging = false;
    this.dragMode = 'rotate';
    this.dragStart = { x: 0, y: 0, tx: 0, ty: 0, yaw: 0, pitch: 0 };

    this.resize = this.resize.bind(this);
    this.onMouseDown = this.onMouseDown.bind(this);
    this.onMouseMove = this.onMouseMove.bind(this);
    this.onMouseLeave = this.onMouseLeave.bind(this);
    this.onWheel = this.onWheel.bind(this);

    this.resize();
    window.addEventListener('resize', this.resize);
    this.attachInput();
  }

  destroy() {
    this.running = false;
    cancelAnimationFrame(this.rafId);
    window.removeEventListener('resize', this.resize);
    this.canvas.removeEventListener('mousemove', this.onMouseMove);
    this.canvas.removeEventListener('mousedown', this.onMouseDown);
    this.canvas.removeEventListener('wheel', this.onWheel);
    this.canvas.removeEventListener('mouseleave', this.onMouseLeave);
  }

  build() {
    const { nodes, links, adjacency, nameToId } = buildBrainGraph();
    this.nodes = nodes;
    this.links = links;
    this.adjacency = adjacency;
    this.nameToId = nameToId;
    this.thoughts = [];
    this._proj = new Float32Array(nodes.length * 3);
    this.dust = buildBrainDust(900);
    this.surface = buildBrainSurface(2200);
    this.fitToView();
    this.onStats({ nodes: this.nodes.length, links: this.links.length, active: 0 });
  }

  fitToView() {
    const padding = 100;
    const bw = 560, bh = 560;
    const k = Math.min((this.width  - padding * 2) / bw,
                       (this.height - padding * 2) / bh);
    this.transform.k = Math.max(0.4, Math.min(2.4, k));
    this.transform.x = this.width / 2;
    this.transform.y = this.height / 2 - 30 * this.transform.k;
  }

  cameraMatrix() {
    return {
      cy: Math.cos(this.camera.yaw),
      sy: Math.sin(this.camera.yaw),
      cp: Math.cos(this.camera.pitch),
      sp: Math.sin(this.camera.pitch),
    };
  }

  projectFast(x, y, z, m) {
    const x1 =  x * m.cy + y * m.sy;
    const y1 = -x * m.sy + y * m.cy;
    const y2 = y1 * m.cp - z * m.sp;
    const depth = y1 * m.sp + z * m.cp;
    return {
      sx: x1 * this.transform.k + this.transform.x,
      sy: y2 * this.transform.k + this.transform.y,
      depth,
    };
  }

  attachInput() {
    this.canvas.addEventListener('mousemove', this.onMouseMove);
    this.canvas.addEventListener('mousedown', this.onMouseDown);
    this.canvas.addEventListener('wheel', this.onWheel, { passive: false });
    this.canvas.addEventListener('mouseleave', this.onMouseLeave);
  }

  onMouseDown(e) {
    this.dragging = true;
    this.dragMode = (e.shiftKey || e.button === 2) ? 'pan' : 'rotate';
    this.camera.animating = false;
    this.canvas.classList.add('grabbing');
    this.dragStart = {
      x: e.clientX, y: e.clientY,
      tx: this.transform.x, ty: this.transform.y,
      yaw: this.camera.yaw, pitch: this.camera.pitch,
    };
    let moved = false;
    const clickTargetId = this.hoverId;
    const move = (me) => {
      if (!this.dragging) return;
      const dx = me.clientX - this.dragStart.x;
      const dy = me.clientY - this.dragStart.y;
      if (dx*dx + dy*dy > 16) moved = true;
      if (this.dragMode === 'pan') {
        this.transform.x = this.dragStart.tx + dx;
        this.transform.y = this.dragStart.ty + dy;
      } else {
        this.camera.yaw   = this.dragStart.yaw   + dx * 0.0065;
        this.camera.pitch = clamp(this.dragStart.pitch + dy * 0.0065, 0, Math.PI * 0.95);
        this.camera.targetYaw = this.camera.yaw;
        this.camera.targetPitch = this.camera.pitch;
        this.onCamera({ yaw: this.camera.yaw, pitch: this.camera.pitch });
      }
    };
    const up = () => {
      this.dragging = false;
      this.canvas.classList.remove('grabbing');
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
      if (!moved && clickTargetId != null) {
        const n = this.nodes[clickTargetId];
        if (n && (n.md || n.isSatellite)) this.onNodeClick(n);
      }
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
    e.preventDefault();
  }

  onMouseMove(e) {
    if (this.dragging) return;
    if (!this._proj) return;
    const rect = this.canvas.getBoundingClientRect();
    const sx = e.clientX - rect.left;
    const sy = e.clientY - rect.top;
    let bestId = -1, bestD = Infinity;
    // Pass 1: vault nodes (priority)
    for (let i = 0; i < this.nodes.length; i++) {
      if (!this.nodes[i].isVault && this.nodes[i].category !== 'session') continue;
      const px = this._proj[i*3], py = this._proj[i*3 + 1];
      const d2 = (px-sx)*(px-sx) + (py-sy)*(py-sy);
      if (d2 < bestD && d2 < 18*18) { bestD = d2; bestId = i; }
    }
    // Pass 2: satellites (only if no vault node found)
    if (bestId === -1) {
      for (let i = 0; i < this.nodes.length; i++) {
        if (!this.nodes[i].isSatellite) continue;
        const px = this._proj[i*3], py = this._proj[i*3 + 1];
        const d2 = (px-sx)*(px-sx) + (py-sy)*(py-sy);
        if (d2 < bestD && d2 < 11*11) { bestD = d2; bestId = i; }
      }
    }
    if (bestId !== this.hoverId) {
      this.hoverId = bestId === -1 ? null : bestId;
      this.canvas.classList.toggle('pointing', this.hoverId != null);
    }
    if (this.hoverId != null) {
      const px = this._proj[this.hoverId*3 + 0];
      const py = this._proj[this.hoverId*3 + 1];
      const n = this.nodes[this.hoverId];
      this.onHover(n, { x: rect.left + px, y: rect.top + py });
    } else {
      this.onHover(null, null);
    }
  }

  onMouseLeave() {
    this.hoverId = null;
    this.canvas.classList.remove('pointing');
    this.onHover(null, null);
  }

  onWheel(e) {
    e.preventDefault();
    const rect = this.canvas.getBoundingClientRect();
    const sx = e.clientX - rect.left;
    const sy = e.clientY - rect.top;
    const factor = Math.exp(-e.deltaY * 0.0015);
    const newK = clamp(this.transform.k * factor, 0.35, 4.0);
    const ratio = newK / this.transform.k;
    this.transform.x = sx - (sx - this.transform.x) * ratio;
    this.transform.y = sy - (sy - this.transform.y) * ratio;
    this.transform.k = newK;
  }

  resize() {
    this.dpr = window.devicePixelRatio || 1;
    const w = window.innerWidth, h = window.innerHeight;
    this.width = w; this.height = h;
    this.canvas.width  = Math.floor(w * this.dpr);
    this.canvas.height = Math.floor(h * this.dpr);
    this.canvas.style.width = w + 'px';
    this.canvas.style.height = h + 'px';
    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    if (this.nodes.length) this.fitToView();
  }

  setView(yaw, pitch, animate = true) {
    if (animate) {
      this.camera.targetYaw = yaw;
      this.camera.targetPitch = pitch;
      this.camera.animating = true;
    } else {
      this.camera.yaw = this.camera.targetYaw = yaw;
      this.camera.pitch = this.camera.targetPitch = pitch;
      this.camera.animating = false;
    }
  }
  setAutoRotate(on) { this.camera.autoRotate = !!on; }

  // maxDepth: limita BFS a N hops (Infinity = comportamento original do botão)
  // vaultOnly: quando true, ignora neurônios de fundo (category === 'bg') no BFS
  triggerThought(rootId, maxDepth = Infinity, vaultOnly = false) {
    if (!this.nodes.length) return;
    let root;
    if (rootId != null && this.nodes[rootId]) {
      root = this.nodes[rootId];
    } else {
      const claudicaroId = this.nameToId['Claudicaro'];
      if (claudicaroId !== undefined && Math.random() < 0.4) {
        root = this.nodes[claudicaroId];
      } else {
        const hubs = this.nodes.filter(n => n.hub);
        root = hubs.length && Math.random() < 0.75
          ? hubs[Math.floor(Math.random() * hubs.length)]
          : this.nodes[Math.floor(Math.random() * this.nodes.length)];
      }
    }
    const dist = new Map();
    dist.set(root.id, 0);
    const queue = [root.id];
    let maxDist = 0;
    while (queue.length) {
      const id = queue.shift();
      const d = dist.get(id);
      if (d >= maxDepth) continue;
      for (const nb of this.adjacency[id]) {
        if (dist.has(nb)) continue;
        if (vaultOnly && this.nodes[nb].category === 'bg') continue;
        dist.set(nb, d + 1);
        if (d + 1 > maxDist) maxDist = d + 1;
        queue.push(nb);
      }
    }
    this.thoughts.push({ startedAt: performance.now(), dist, maxDist, root: root.id });
    const now = performance.now();
    this.thoughts = this.thoughts.filter(t => now - t.startedAt < 4500);
  }

  nodeActivation(id, now) {
    if (!this.thoughts.length) return 0;
    let total = 0;
    const hopMs = 90 / this.options.speed;
    const tau = 600;
    for (const th of this.thoughts) {
      const t = now - th.startedAt;
      const d = th.dist.get(id);
      if (d === undefined) continue;
      const arrive = d * hopMs;
      if (t < arrive) continue;
      const elapsed = t - arrive;
      const rise = Math.min(1, elapsed / 60);
      const decay = Math.exp(-elapsed / tau);
      total += rise * decay;
    }
    if (this.nodes[id]?.isSatellite) total *= 0.42;
    return Math.min(1.6, total);
  }

  start() {
    this.running = true;
    const loop = () => {
      if (!this.running) return;
      this.tick();
      this.draw();
      this.rafId = requestAnimationFrame(loop);
    };
    this.rafId = requestAnimationFrame(loop);
  }

  tick() {
    if (this.camera.animating) {
      const dy = this.camera.targetYaw   - this.camera.yaw;
      const dp = this.camera.targetPitch - this.camera.pitch;
      this.camera.yaw   += dy * 0.12;
      this.camera.pitch += dp * 0.12;
      if (Math.abs(dy) < 0.003 && Math.abs(dp) < 0.003) {
        this.camera.yaw = this.camera.targetYaw;
        this.camera.pitch = this.camera.targetPitch;
        this.camera.animating = false;
      }
      this.onCamera({ yaw: this.camera.yaw, pitch: this.camera.pitch });
    }
    if (this.camera.autoRotate && !this.dragging && !this.camera.animating) {
      this.camera.yaw += 0.0024 * this.options.speed;
      this.camera.targetYaw = this.camera.yaw;
    }
  }

  draw() {
    const ctx = this.ctx;
    const w = this.width, h = this.height;
    const now = performance.now();
    const t = now / 1000;
    const m = this.cameraMatrix();
    const k = this.transform.k;

    ctx.fillStyle = '#0B0F19';
    ctx.fillRect(0, 0, w, h);

    // ── Brain dust ─────────────────────────────────────────────────
    if (this.dust.length) {
      ctx.globalCompositeOperation = 'lighter';
      const dustAlphaBase = 0.038 * this.options.glow;
      for (let i = 0; i < this.dust.length; i++) {
        const d = this.dust[i];
        const p = this.projectFast(d.x, d.y, d.z, m);
        const depthMul = 1 - clamp((p.depth + 200) / 600, 0, 0.45);
        ctx.globalAlpha = dustAlphaBase * depthMul;
        const r = 9 * k;
        ctx.drawImage(this.glowDust, p.sx - r, p.sy - r, r * 2, r * 2);
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }

    // ── Project nodes ──────────────────────────────────────────────
    const proj = this._proj;
    for (let i = 0; i < this.nodes.length; i++) {
      const n = this.nodes[i];
      const wx = n.x + Math.sin(t * n.freq + n.phase) * n.amp;
      const wy = n.y + Math.sin(t * n.freq * 1.07 + n.phase + 1.3) * n.amp * 0.85;
      const wz = n.z + Math.sin(t * n.freq * 0.93 + n.phase + 2.7) * n.amp * 0.9;
      const p = this.projectFast(wx, wy, wz, m);
      proj[i*3 + 0] = p.sx;
      proj[i*3 + 1] = p.sy;
      proj[i*3 + 2] = p.depth;
    }

    // ── Activations ────────────────────────────────────────────────
    const act = new Float32Array(this.nodes.length);
    let activeCount = 0;
    for (let i = 0; i < this.nodes.length; i++) {
      const a = this.nodeActivation(i, now);
      act[i] = a;
      if (a > 0.05) activeCount++;
    }

    const isHovering = this.hoverId != null;
    const hoverSet = new Set();
    if (isHovering) {
      hoverSet.add(this.hoverId);
      for (const nb of this.adjacency[this.hoverId]) hoverSet.add(nb);
    }

    // ── Surface back ───────────────────────────────────────────────
    if (this.surface.length) {
      ctx.globalCompositeOperation = 'lighter';
      const spr  = this.surfaceSprite;
      const sBase = 0.032 * this.options.glow;
      const sprR  = 20 * k;
      for (const pt of this.surface) {
        const p = this.projectFast(pt.x, pt.y, pt.z, m);
        if (p.depth <= 0) continue;
        const depthDim = clamp(1 - p.depth / 480, 0.28, 1.0);
        ctx.globalAlpha = sBase * depthDim;
        ctx.drawImage(spr, p.sx - sprR, p.sy - sprR, sprR * 2, sprR * 2);
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }

    // ── Edges ──────────────────────────────────────────────────────
    const edgeOrder = new Array(this.links.length);
    const edgeDepth = new Float32Array(this.links.length);
    for (let i = 0; i < this.links.length; i++) {
      const l = this.links[i];
      edgeDepth[i] = (proj[l.source.id*3 + 2] + proj[l.target.id*3 + 2]) * 0.5;
      edgeOrder[i] = i;
    }
    edgeOrder.sort((a, b) => edgeDepth[b] - edgeDepth[a]);

    ctx.lineCap = 'round';
    for (let k2 = 0; k2 < edgeOrder.length; k2++) {
      const li = edgeOrder[k2];
      const l = this.links[li];
      const sId = l.source.id, tId = l.target.id;
      const ax = proj[sId*3], ay = proj[sId*3 + 1];
      const bx = proj[tId*3], by = proj[tId*3 + 1];
      const meanDepth = (proj[sId*3 + 2] + proj[tId*3 + 2]) * 0.5;
      const depthFade = clamp(0.9 - meanDepth / 700, 0.25, 1.0);
      const len = Math.hypot(l.target.x - l.source.x, l.target.y - l.source.y, l.target.z - l.source.z);
      let alpha = 0.18 * (1 - Math.min(1, (len - 30) / 140));
      alpha = Math.max(0.03, alpha);

      const aAct = (act[sId] + act[tId]) * 0.5;
      const hover = isHovering && hoverSet.has(sId) && hoverSet.has(tId);
      if (isHovering && !hover) alpha *= 0.22;
      if (hover) alpha = Math.min(1, alpha + 0.55);
      alpha = Math.min(1, alpha + aAct * 0.7);
      alpha *= depthFade;

      // Satellite links — very faint, almost invisible
      if (l.isSatelliteLink) alpha *= 0.28;
      // Vault links get stronger color
      if (l.isVaultLink) alpha = Math.min(1, alpha * 2.2);

      let color;
      if (aAct > 0.05) {
        const mix = Math.min(1, aAct);
        const r = Math.round(120 + (255 - 120) * mix);
        const g = Math.round(220 + (255 - 220) * mix);
        color = `rgba(${r},${g},255,${alpha})`;
      } else if (hover) {
        color = `rgba(160, 230, 255, ${alpha})`;
      } else if (l.isVaultLink) {
        // Pick color based on source node category
        const sc = this.nodes[sId].category;
        const col = CAT_COLOR[sc] || '#4cc3ff';
        const h = parseInt(col.slice(1,3), 16);
        const v = parseInt(col.slice(3,5), 16);
        const b2 = parseInt(col.slice(5,7), 16);
        color = `rgba(${h},${v},${b2},${alpha})`;
      } else {
        color = `rgba(110, 150, 210, ${alpha})`;
      }
      ctx.strokeStyle = color;
      ctx.lineWidth = (hover ? 0.9 : l.isVaultLink ? 0.75 : 0.55) + aAct * 1.2;
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.lineTo(bx, by);
      ctx.stroke();
    }

    // ── Nodes glow pass (additive) ─────────────────────────────────
    const nodeOrder = new Array(this.nodes.length);
    for (let i = 0; i < this.nodes.length; i++) nodeOrder[i] = i;
    nodeOrder.sort((a, b) => proj[b*3 + 2] - proj[a*3 + 2]);

    ctx.globalCompositeOperation = 'lighter';
    for (let oi = 0; oi < nodeOrder.length; oi++) {
      const i = nodeOrder[oi];
      const n = this.nodes[i];
      const sx = proj[i*3], sy = proj[i*3 + 1], depth = proj[i*3 + 2];
      const depthFade = clamp(0.85 - depth / 700, 0.3, 1.0);
      const baseSize = 4 + n.weight * 4 + (n.hub ? 3 : 0) + (n.isVault ? 2 : 0);
      const a = act[i];
      const hover = isHovering && hoverSet.has(i);
      const hoverBoost = hover ? 1.4 : (isHovering ? 0.4 : 1.0);

      const catSprite = this.glowSprites[n.category] || this.glowSprites.bg;
      if (n.isSatellite) {
        // Dim satellite glow — barely visible at rest, glows softly when activated
        const satR = (baseSize * 3.2) * k * this.options.glow;
        const satA = (0.10 + n.weight * 0.14) * depthFade;
        if (satA > 0.005) {
          ctx.globalAlpha = Math.min(1, satA);
          ctx.drawImage(catSprite, sx - satR, sy - satR, satR * 2, satR * 2);
        }
        if (a > 0.02) {
          const hotR = (baseSize * (3.5 + a * 5)) * k * this.options.glow;
          ctx.globalAlpha = Math.min(1, a * 0.55);
          ctx.drawImage(this.glowHot, sx - hotR, sy - hotR, hotR * 2, hotR * 2);
        }
      } else {
        const coldR = (baseSize * 3.4 + (n.hub ? 6 : 0)) * k * this.options.glow * hoverBoost;
        const coldA = (0.18 + n.weight * 0.18 + (n.hub ? 0.12 : 0) + (n.isVault ? 0.08 : 0)) * hoverBoost * depthFade;
        if (coldA > 0.01) {
          ctx.globalAlpha = Math.min(1, coldA);
          ctx.drawImage(catSprite, sx - coldR, sy - coldR, coldR * 2, coldR * 2);
        }
        if (a > 0.02) {
          const hotR = (baseSize * (5 + a * 8)) * k * this.options.glow;
          ctx.globalAlpha = Math.min(1, a * 0.9);
          ctx.drawImage(this.glowHot, sx - hotR, sy - hotR, hotR * 2, hotR * 2);
        }
      }
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    // ── Nodes core pass ────────────────────────────────────────────
    for (let oi = 0; oi < nodeOrder.length; oi++) {
      const i = nodeOrder[oi];
      const n = this.nodes[i];
      const sx = proj[i*3], sy = proj[i*3 + 1], depth = proj[i*3 + 2];
      const depthFade = clamp(0.7 - depth / 800, 0.35, 1.0);
      const baseSize = 1.4 + n.weight * 1.6 + (n.hub ? 0.9 : 0) + (n.isVault ? 0.6 : 0);
      const a = act[i];
      const hover = isHovering && hoverSet.has(i);

      let color;
      if (n.isSatellite) {
        const col = CAT_COLOR[n.category] || '#4cc3ff';
        const cr = parseInt(col.slice(1,3), 16);
        const cg = parseInt(col.slice(3,5), 16);
        const cb = parseInt(col.slice(5,7), 16);
        const t2 = (0.28 + a * 0.52) * depthFade;
        color = `rgba(${cr},${cg},${cb},${t2})`;
      } else if (a > 0.05) {
        const mix = Math.min(1, a);
        const r = Math.round(180 + 75 * mix);
        const g = Math.round(235 + 20 * mix);
        color = `rgb(${r},${g},255)`;
      } else if (hover) {
        color = '#dff6ff';
      } else if (n.isVault) {
        const col = CAT_COLOR[n.category] || '#4cc3ff';
        const t2 = (0.7 + n.weight * 0.3) * depthFade;
        const r = parseInt(col.slice(1,3), 16);
        const g = parseInt(col.slice(3,5), 16);
        const b2 = parseInt(col.slice(5,7), 16);
        color = `rgba(${r},${g},${b2},${t2})`;
      } else if (n.hub) {
        color = `rgba(191, 230, 255, ${depthFade})`;
      } else {
        const t2 = (0.55 + n.weight * 0.35) * depthFade;
        color = `rgba(180, 220, 255, ${t2})`;
      }
      ctx.fillStyle = color;
      ctx.beginPath();
      const r = n.isSatellite
        ? (1.3 + a * 1.1) * Math.max(0.6, k * 0.9)
        : (baseSize + a * 1.6) * Math.max(0.6, k * 0.9);
      if (n.category === 'session') {
        const dr = r * 1.5;
        ctx.moveTo(sx, sy - dr); ctx.lineTo(sx + dr, sy);
        ctx.lineTo(sx, sy + dr); ctx.lineTo(sx - dr, sy);
        ctx.closePath();
      } else {
        ctx.arc(sx, sy, r, 0, Math.PI * 2);
      }
      ctx.fill();

      if (i === this.hoverId) {
        ctx.strokeStyle = 'rgba(255,255,255,0.85)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(sx, sy, r + 4, 0, Math.PI * 2);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(76,195,255,0.4)';
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.arc(sx, sy, r + 9, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Label for vault nodes when hovered or for big hubs always
      if (n.isVault && (hover || (n.hub && k > 1.1))) {
        ctx.globalAlpha = hover ? 0.95 : 0.55;
        ctx.font = `${hover ? 600 : 400} ${Math.round((9 + n.weight * 3) * Math.max(0.7, k * 0.85))}px 'JetBrains Mono', monospace`;
        ctx.fillStyle = hover ? '#ffffff' : (CAT_COLOR[n.category] || '#4cc3ff');
        ctx.textAlign = 'center';
        ctx.fillText(n.label, sx, sy - r - 5);
        ctx.globalAlpha = 1;
      }
    }

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    // ── Surface front ──────────────────────────────────────────────
    if (this.surface.length) {
      ctx.globalCompositeOperation = 'lighter';
      const spr  = this.surfaceSprite;
      const sBase = 0.032 * this.options.glow;
      const sprR  = 20 * k;
      for (const pt of this.surface) {
        const p = this.projectFast(pt.x, pt.y, pt.z, m);
        if (p.depth > 0) continue;
        const frontBoost = clamp(1 + (-p.depth) / 280, 1.0, 1.7);
        ctx.globalAlpha = Math.min(1, sBase * frontBoost);
        ctx.drawImage(spr, p.sx - sprR, p.sy - sprR, sprR * 2, sprR * 2);
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }

    // ── Thought pulse rings ────────────────────────────────────────
    for (const th of this.thoughts) {
      const t2 = now - th.startedAt;
      if (t2 < 0 || t2 > 2200) continue;
      const sx = proj[th.root*3], sy = proj[th.root*3 + 1];
      for (let ring = 0; ring < 3; ring++) {
        const delay = ring * 220;
        const dt = t2 - delay;
        if (dt < 0 || dt > 1200) continue;
        const p = dt / 1200;
        const radius = p * 90 * k;
        ctx.strokeStyle = `rgba(150,230,255,${(1 - p) * 0.5})`;
        ctx.lineWidth = 1.4 * (1 - p) + 0.3;
        ctx.beginPath();
        ctx.arc(sx, sy, radius, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    if ((now | 0) % 6 === 0) {
      this.onStats({ nodes: this.nodes.length, links: this.links.length, active: activeCount });
    }
  }

  setSpeed(v) { this.options.speed = v; }
  setGlow(v)  { this.options.glow = v; }

  // ── Inject session nodes (engrams) from sessions.json ───────────────
  injectSessionNodes(sessions) {
    if (!sessions || !sessions.length || !this.nodes.length) return;
    for (const sess of sessions) {
      const refIds = (sess.nodesUsed || [])
        .map(name => this.nameToId[name])
        .filter(id => id !== undefined);
      if (!refIds.length) continue;

      // Position at centroid of referenced nodes + small jitter
      let cx = 0, cy = 0, cz = 0;
      for (const id of refIds) { cx += this.nodes[id].x; cy += this.nodes[id].y; cz += this.nodes[id].z; }
      cx = cx / refIds.length + (Math.random() - 0.5) * 24;
      cy = cy / refIds.length + (Math.random() - 0.5) * 24;
      cz = cz / refIds.length + (Math.random() - 0.5) * 24;

      // Region = most common region among referenced nodes
      const rc = {};
      for (const id of refIds) { const r = this.nodes[id].region; rc[r] = (rc[r] || 0) + 1; }
      const region = Object.entries(rc).sort((a, b) => b[1] - a[1])[0][0];

      const id = this.nodes.length;
      const sn = {
        id, x: cx, y: cy, z: cz, region,
        weight: 0.72, label: sess.date || sess.id,
        category: 'session', desc: sess.title || '',
        sessionData: sess,
        hub: false, isVault: true,
        phase: Math.random() * Math.PI * 2, freq: 0.28, amp: 1.8,
      };
      this.nodes.push(sn);
      this.adjacency.push([]);

      // Link session node to its referenced nodes
      const seen = new Set();
      for (const refId of refIds) {
        const k = id < refId ? `${id}-${refId}` : `${refId}-${id}`;
        if (seen.has(k)) continue;
        seen.add(k);
        const d = Math.hypot(cx - this.nodes[refId].x, cy - this.nodes[refId].y, cz - this.nodes[refId].z);
        this.links.push({ source: sn, target: this.nodes[refId], rest: d, isVaultLink: true });
        this.adjacency[id].push(refId);
        this.adjacency[refId].push(id);
      }
    }
    this._proj = new Float32Array(this.nodes.length * 3);
  }
}

function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

window.CerebroEngine = CerebroEngine;
window.VAULT_NODES = VAULT_NODES;
window.CAT_COLOR = CAT_COLOR;

  </script>

  <script type="text/babel" data-presets="react">

const { useEffect, useRef, useState, useCallback } = React;

const REGION_LABELS = {
  'cerebrum-L': 'DSG — hemisfério E',
  'cerebrum-R': 'CAST — hemisfério D',
  'cerebellum': 'cerebelo — Tools',
  'brainstem':  'tronco — MCPs',
  'session':    'memória — engrama',
};

const CAT_LABEL = {
  dsg:     'DSG',
  cast:    'CAST',
  skill:   'Skill',
  agent:   'Agente',
  mcp:     'MCP',
  session: 'Sessão',
  bg:      '',
};

// Badge coloring from CAT_COLOR hex
function hexToRgb(hex) {
  return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
}

function Slider({ label, value, min, max, step, onChange, fmt }) {
  const pct = ((value - min) / (max - min)) * 100;
  return (
    <div className="ctl">
      <div className="ctl-head">
        <span className="ctl-label">{label}</span>
        <span className="ctl-value">{fmt ? fmt(value) : value.toFixed(2)}</span>
      </div>
      <input type="range" min={min} max={max} step={step} value={value}
        onChange={e => onChange(parseFloat(e.target.value))}
        style={{ '--p': pct + '%' }} />
    </div>
  );
}

function StatusBar({ stats, bridge }) {
  return (
    <div className="status">
      <div className="stat"><span>nós</span><b>{stats.nodes}</b></div>
      <div className="stat"><span>edges</span><b>{stats.links}</b></div>
      <div className="stat">
        <span>ativos</span>
        <b style={{ color: stats.active > 0 ? '#79e8ff' : undefined }}>{stats.active}</b>
      </div>
      <div className="stat" title={bridge.connected ? `último: ${bridge.lastNode || '—'}` : 'bridge offline — rode cerebro-start.sh'}>
        <span style={{
          width: 6, height: 6, borderRadius: '50%', display: 'inline-block', flexShrink: 0,
          background: bridge.connected ? '#4ade80' : '#3a4361',
          boxShadow: bridge.connected ? '0 0 6px #4ade8088' : 'none',
          transition: 'background .4s',
        }} />
        <span style={{ color: bridge.connected ? '#4ade80' : undefined }}>
          {bridge.connected ? (bridge.lastNode ? bridge.lastNode.slice(0, 14) : 'live') : 'bridge off'}
        </span>
      </div>
    </div>
  );
}

function Tooltip({ node, pos }) {
  if (!node || !pos) return null;
  const region = REGION_LABELS[node.region] || node.region;
  const catLabel = CAT_LABEL[node.category] || '';
  const catColor = window.CAT_COLOR[node.category] || '#4cc3ff';
  const [r, g, b] = hexToRgb(catColor);

  if (node.isSatellite) {
    return (
      <div className="tooltip" style={{ left: pos.x, top: pos.y }}>
        <div className="tooltip-label" style={{ color: catColor }}>{node.label}</div>
        <div className="tooltip-desc" style={{ color: '#6b7593' }}>domínio de {node.parentName}</div>
        <div className="tooltip-meta" style={{ marginTop: 5, display: 'flex', justifyContent: 'space-between' }}>
          <span><i /> {region}</span>
          <span style={{ color: catColor, opacity: 0.7, fontSize: '10px' }}>↗ buscar</span>
        </div>
      </div>
    );
  }

  return (
    <div className="tooltip" style={{ left: pos.x, top: pos.y }}>
      <div className="tooltip-label">{node.label}</div>
      {node.desc && <div className="tooltip-desc">{node.desc}</div>}
      {node.satelliteLabels?.length > 0 && (
        <div style={{ marginTop: 5, fontSize: '10px', lineHeight: 1.8, borderTop: '1px solid rgba(76,195,255,0.1)', paddingTop: 5 }}>
          {node.satelliteLabels.slice(0, 10).map(lbl => (
            <span key={lbl} style={{ display: 'inline-block', marginRight: 6, color: '#4a7a94', opacity: 0.8 }}>· {lbl}</span>
          ))}
        </div>
      )}
      {node.category === 'session' && node.sessionData?.nodesUsed?.length > 0 && (
        <div style={{ marginTop: 4, fontSize: '10px', color: '#6b7593', lineHeight: 1.6 }}>
          {node.sessionData.nodesUsed.slice(0,6).map(n2 => (
            <span key={n2} style={{ display: 'inline-block', marginRight: 5, color: '#9bb4cc' }}>· {n2}</span>
          ))}
        </div>
      )}
      {catLabel && (
        <div style={{ marginTop: 4 }}>
          <span className="tooltip-badge"
            style={{ background: `rgba(${r},${g},${b},0.15)`, color: catColor, border: `1px solid rgba(${r},${g},${b},0.3)` }}>
            {catLabel}
          </span>
          {node.hub && <span className="tooltip-badge" style={{ background: 'rgba(255,255,255,0.08)', color: '#79e8ff', border: '1px solid rgba(76,195,255,0.3)', marginLeft: 4 }}>hub</span>}
        </div>
      )}
      <div className="tooltip-meta" style={{ marginTop: 5, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <span><i /> {region}</span>
        {node.md && <span style={{ color: '#4cc3ff', opacity: 0.7, fontSize: '10px', letterSpacing: '0.02em' }}>↗ ler</span>}
      </div>
    </div>
  );
}

function Panel({ speed, setSpeed, glow, setGlow, auto, setAuto, autoRotate, setAutoRotate, onTrigger, onView }) {
  const [open, setOpen] = useState(true);
  return (
    <div className={`panel ${open ? '' : 'collapsed'}`}>
      <div className="panel-header">
        <span className="panel-title">Controles</span>
        <button className="panel-collapse" onClick={() => setOpen(o => !o)} aria-label="collapse">
          {open
            ? <svg width="12" height="12" viewBox="0 0 12 12"><path d="M3 5l3 3 3-3" stroke="currentColor" strokeWidth="1.4" fill="none" strokeLinecap="round" /></svg>
            : <svg width="12" height="12" viewBox="0 0 12 12"><path d="M3 7l3-3 3 3" stroke="currentColor" strokeWidth="1.4" fill="none" strokeLinecap="round" /></svg>
          }
        </button>
      </div>
      <div className="panel-body">
        <div className="legend">
          {Object.entries(window.CAT_COLOR).filter(([k]) => k !== 'bg' && k !== 'session').map(([cat, col]) => (
            <div key={cat} className="legend-item">
              <div className="legend-dot" style={{ background: col, boxShadow: `0 0 6px ${col}88` }} />
              <span>{{ dsg: 'DSG (cerebrum-L)', cast: 'CAST (cerebrum-R)', skill: 'Skills (cerebelo)', agent: 'Agentes (cerebelo)', mcp: 'MCPs (tronco)' }[cat]}</span>
            </div>
          ))}
        </div>

        <div className="divider" />

        <Slider label="Velocidade" value={speed} min={0.3} max={3.0} step={0.05} onChange={setSpeed} fmt={v => v.toFixed(2) + '×'} />
        <Slider label="Glow" value={glow} min={0.2} max={2.5} step={0.05} onChange={setGlow} fmt={v => v.toFixed(2) + '×'} />

        <div className="divider" />

        <div className="view-presets">
          <span className="ctl-label" style={{ marginBottom: 4 }}>Vista</span>
          <div className="view-grid">
            <button className="view-btn" onClick={() => onView('top')} title="Top-down">
              <svg width="22" height="16" viewBox="0 0 22 16" fill="none"><ellipse cx="7" cy="8" rx="5" ry="6.4" stroke="currentColor" strokeWidth="1.1"/><ellipse cx="15" cy="8" rx="5" ry="6.4" stroke="currentColor" strokeWidth="1.1"/></svg>
              <span>Top</span>
            </button>
            <button className="view-btn" onClick={() => onView('threeq')} title="3/4">
              <svg width="22" height="16" viewBox="0 0 22 16" fill="none"><ellipse cx="11" cy="8" rx="8" ry="5" stroke="currentColor" strokeWidth="1.1"/><path d="M3 8 Q11 4 19 8" stroke="currentColor" strokeWidth="1.1" fill="none"/></svg>
              <span>3/4</span>
            </button>
            <button className="view-btn" onClick={() => onView('side')} title="Lado">
              <svg width="22" height="16" viewBox="0 0 22 16" fill="none"><path d="M3 10 Q3 3 11 3 Q19 3 19 9 Q19 13 14 13 L13 14 L11 14 L11 13 Q4 13 3 10 Z" stroke="currentColor" strokeWidth="1.1" fill="none"/></svg>
              <span>Lado</span>
            </button>
            <button className="view-btn" onClick={() => onView('front')} title="Frente">
              <svg width="22" height="16" viewBox="0 0 22 16" fill="none"><ellipse cx="7" cy="7" rx="4.5" ry="5.5" stroke="currentColor" strokeWidth="1.1"/><ellipse cx="15" cy="7" rx="4.5" ry="5.5" stroke="currentColor" strokeWidth="1.1"/><line x1="11" y1="12" x2="11" y2="15" stroke="currentColor" strokeWidth="1.1"/></svg>
              <span>Frente</span>
            </button>
          </div>
        </div>

        <div className="toggle-row">
          <span>auto-rotação</span>
          <div className={`toggle ${autoRotate ? 'on' : ''}`} onClick={() => setAutoRotate(v => !v)} role="switch" aria-checked={autoRotate} />
        </div>

        <div className="divider" />

        <button className="trigger" onClick={onTrigger}>
          <span className="spark" />
          Simular Pensamento
        </button>

        <div className="toggle-row">
          <span>auto-pulso</span>
          <div className={`toggle ${auto ? 'on' : ''}`} onClick={() => setAuto(v => !v)} role="switch" aria-checked={auto} />
        </div>
      </div>
    </div>
  );
}

function MdViewer({ node, onClose }) {
  const [content, setContent] = useState(null);
  const [loading, setLoading] = useState(false);
  const open = node != null;
  const catColor = node ? (window.CAT_COLOR[node.category] || '#4cc3ff') : '#4cc3ff';

  useEffect(() => {
    if (!node) return;
    if (node.isSatellite) { setContent(null); return; }
    if (!node.md) { setContent(null); return; }
    setLoading(true);
    setContent(null);
    const encoded = node.md.split('/').map(p => encodeURIComponent(p)).join('/');
    fetch(`http://localhost:8765/${encoded}`)
      .then(r => r.text())
      .then(txt => { setContent(txt); setLoading(false); })
      .catch(() => { setContent('> Não foi possível carregar o arquivo.'); setLoading(false); });
  }, [node?.md, node?.isSatellite]);

  // Fechar com Escape
  useEffect(() => {
    if (!open) return;
    const onKey = e => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [open, onClose]);

  return (
    <React.Fragment>
      <div className={`md-overlay ${open ? 'open' : ''}`} onClick={onClose} />
      <div className={`md-viewer ${open ? 'open' : ''}`}>
        <div className="md-viewer-header">
          <div className="md-viewer-title" style={{ color: catColor }}>
            {node?.isSatellite ? node?.label : (node?.label || '')}
            {node?.md && <span style={{ marginLeft: 8, opacity: 0.4, fontWeight: 400, fontSize: '10px' }}>{node.md.split('/').pop()}</span>}
          </div>
          <button className="md-viewer-close" onClick={onClose} title="Fechar (Esc)">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M2 2l10 10M12 2L2 12" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/>
            </svg>
          </button>
        </div>
        <div className="md-viewer-body">
          {node?.isSatellite ? (
            <div className="md-sat-panel">
              <div className="md-sat-concept" style={{ color: catColor }}>{node.label}</div>
              <div className="md-sat-parent">domínio de <b style={{ color: catColor }}>{node.parentName}</b></div>
              <div className="md-sat-hint">Este conceito é conhecimento periférico de <b>{node.parentName}</b>. Clique no nó principal para ler a documentação completa.</div>
            </div>
          ) : loading ? (
            <div style={{ color: 'var(--ink-dim)', fontSize: 12, paddingTop: 8 }}>carregando…</div>
          ) : content != null ? (
            <div className="md-content" dangerouslySetInnerHTML={{ __html: window.marked?.parse(content) || content }} />
          ) : null}
        </div>
      </div>
    </React.Fragment>
  );
}

function App() {
  const engineRef = useRef(null);
  const [hover, setHover] = useState(null);
  const [stats, setStats] = useState({ nodes: 0, links: 0, active: 0 });
  const [speed, setSpeed] = useState(1.0);
  const [glow, setGlow] = useState(1.0);
  const [auto, setAuto] = useState(false);
  const [autoRotate, setAutoRotate] = useState(false);
  const [bridge, setBridge] = useState({ connected: false, lastNode: null });
  const [selectedNode, setSelectedNode] = useState(null);

  useEffect(() => {
    const canvas = document.getElementById('graph');
    const eng = new window.CerebroEngine(canvas);
    engineRef.current = eng;
    eng.onHover = (n, pos) => {
      if (n && pos) setHover({ node: n, pos });
      else setHover(null);
    };
    eng.onStats = (s) => setStats(s);
    eng.onNodeClick = (n) => {
      setSelectedNode(prev => (prev?.label === n.label ? null : n));
    };
    eng.build();
    eng.start();
    const initialPulse = setTimeout(() => eng.triggerThought(), 1100);

    // Load session engrams from bridge
    fetch('http://localhost:8766/sessions')
      .then(r => r.json())
      .then(sessions => { if (sessions?.length) eng.injectSessionNodes(sessions); })
      .catch(() => {});

    return () => { clearTimeout(initialPulse); eng.destroy(); };
  }, []);

  // SSE bridge — dispara pensamentos em tempo real quando Claude usa tools
  useEffect(() => {
    let es = null;
    let retryTimer = null;
    const connect = () => {
      try {
        es = new EventSource('http://localhost:8766/stream');
        es.onopen = () => setBridge(b => ({ ...b, connected: true }));
        es.onmessage = (e) => {
          try {
            const data = JSON.parse(e.data);
            if (data.keep_alive) return;
            if (data.node && engineRef.current) {
              const nodeId = engineRef.current.nameToId[data.node];
              // Só dispara se o nó existe; profundidade 3, apenas nós do vault
              if (nodeId !== undefined) {
                engineRef.current.triggerThought(nodeId, 3, true);
              }
              setBridge(b => ({ ...b, lastNode: data.node }));
            }
          } catch (_) {}
        };
        es.onerror = () => {
          setBridge(b => ({ ...b, connected: false }));
          es.close(); es = null;
          retryTimer = setTimeout(connect, 5000);
        };
      } catch (_) {}
    };
    connect();
    return () => {
      clearTimeout(retryTimer);
      if (es) { es.close(); }
    };
  }, []);

  useEffect(() => { engineRef.current?.setSpeed(speed); }, [speed]);
  useEffect(() => { engineRef.current?.setGlow(glow); }, [glow]);
  useEffect(() => { engineRef.current?.setAutoRotate(autoRotate); }, [autoRotate]);

  const onView = useCallback((kind) => {
    const eng = engineRef.current;
    if (!eng) return;
    const P = Math.PI;
    switch (kind) {
      case 'top':    eng.setView(0,        0.0001);  break;
      case 'threeq': eng.setView(P * 0.13, P * 0.30); break;
      case 'side':   eng.setView(P * 0.5,  P * 0.48); break;
      case 'front':  eng.setView(0,        P * 0.48); break;
    }
  }, []);

  useEffect(() => {
    if (!auto) return;
    const id = setInterval(() => { engineRef.current?.triggerThought(); }, 2400 / speed);
    return () => clearInterval(id);
  }, [auto, speed]);

  useEffect(() => {
    const onKey = (e) => {
      if (e.code === 'Space' && !(e.target instanceof HTMLInputElement)) {
        e.preventDefault();
        engineRef.current?.triggerThought();
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  const onTrigger = useCallback(() => { engineRef.current?.triggerThought(); }, []);

  return (
    <React.Fragment>
      <Panel
        speed={speed} setSpeed={setSpeed}
        glow={glow} setGlow={setGlow}
        auto={auto} setAuto={setAuto}
        autoRotate={autoRotate} setAutoRotate={setAutoRotate}
        onTrigger={onTrigger} onView={onView}
      />
      <Tooltip node={hover?.node} pos={hover?.pos || null} />
      <StatusBar stats={stats} bridge={bridge} />
      <MdViewer node={selectedNode} onClose={() => setSelectedNode(null)} />
    </React.Fragment>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

  </script>
