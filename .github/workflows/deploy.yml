name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: bash scripts/build.sh

      - name: Package build
        run: tar -czf deploy.tar.gz -C site .

      - name: Upload to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: deploy.tar.gz
          target: /home/ubuntu/

      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            rm -rf ~/projects/brain/site/*
            tar -xzf ~/deploy.tar.gz -C ~/projects/brain/site/
            rm ~/deploy.tar.gz
            docker exec brain nginx -s reload
